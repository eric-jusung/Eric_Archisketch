# archisketch.co.jp is already attached to the Netlify site
# radiant-meringue-0071d0.netlify.app. Publish this folder as-is.

[build]
  publish = "."

[[redirects]]
  from = "/privacy"
  to = "/?page=privacy"
  status = 302

[[redirects]]
  from = "/privacy/"
  to = "/?page=privacy"
  status = 302

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
