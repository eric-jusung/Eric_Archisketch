name: image

on:
  push:
    branches:
      - cursor/archisketch-static-site-90a3
      - main
    paths:
      - index.html
      - images/**
      - privacy/**
      - Dockerfile
      - nginx.conf
      - .github/workflows/image.yml

permissions:
  contents: write
  packages: write

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/eric-jusung/eric-archisketch:${{ github.sha }}
            ghcr.io/eric-jusung/eric-archisketch:latest

      - name: Make the package readable by the cluster
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/eric-archisketch/visibility" \
            -f visibility=public

      - name: Point the Argo CD manifest at this image
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          sed -i "s/^    newTag: .*/    newTag: ${GITHUB_SHA}/" deploy/kustomization.yaml
          git add deploy/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m "Deploy image ${GITHUB_SHA} [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
